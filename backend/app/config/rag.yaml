models:
  rag: gpt-5-mini
  embedding: text-embedding-3-large
  reranker: cross-encoder/ms-marco-MiniLM-L6-v2
  evaluation: gpt-4o-mini

prompt:
  name: qa

retrieval:
  num_candidates: 30
  top_k: 5
  rerank_confidence_threshold: 0.2

index:
  collection_name: documents_collection
  docling:
    chunk_size: 400    # token cap for HybridChunker (OpenAITokenizer.max_tokens)
    chunk_overlap: 0   # unused by HybridChunker; recorded in eval CSV only
    do_ocr: false              # enable for scanned/image PDFs (slower, heavier)
    do_table_structure: false  # enable for table-heavy PDFs (slower)
